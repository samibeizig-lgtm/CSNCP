<section class="hero">
  <div class="wrap hero-inner">
    <div>
      <p class="eyebrow">{{ home.eyebrow }}</p>
      <h1>{{ home.title }}</h1>
      <p class="lead">{{ home.lead }}</p>
      <div class="actions">
        <a class="btn arrow" href="{{ @prefix }}annuaire.html">{{ home.cta_directory }}</a>
        <a class="btn ghost" href="{{ @prefix }}espace-patient.html">{{ home.cta_patient }}</a>
      </div>
    </div>
    <div class="hero-visual">
      <div class="logo-anim" role="img" aria-label="CSNCP — {{ site.name_fr }} — {{ site.name_ar }} — Tunisie">
        <div class="logo-symbol">
          <img class="petal p-violet" src="{{ @root }}assets/img/logo-anime/violet.png" alt="" style="transform-origin:38.3% 58.9%">
          <img class="petal p-corail" src="{{ @root }}assets/img/logo-anime/corail.png" alt="" style="transform-origin:62.5% 58.7%">
          <img class="petal p-turquoise" src="{{ @root }}assets/img/logo-anime/turquoise.png" alt="" style="transform-origin:37.8% 64.2%">
          <img class="petal p-orange" src="{{ @root }}assets/img/logo-anime/orange.png" alt="" style="transform-origin:62.7% 64.2%">
          <img class="petal p-soleil" src="{{ @root }}assets/img/logo-anime/soleil.png" alt="" style="transform-origin:42.1% 75.7%">
          <img class="petal p-vert" src="{{ @root }}assets/img/logo-anime/vert.png" alt="" style="transform-origin:58.3% 75.7%">
          <img class="figure-patient" src="{{ @root }}assets/img/logo-anime/bleu.png" alt="" style="transform-origin:50.3% 90%">
        </div>
        <img class="logo-text" src="{{ @root }}assets/img/logo-anime/texte.png" width="600" height="331" alt="">
      </div>
    </div>
  </div>
</section>

<section class="section blue">
  <div class="wrap">
    <div class="section-head">
      <h2>{{ figures.title }}</h2>
    </div>
    <div class="figures">{{ @figures }}</div>
    <p class="note">{{ figures.note }}</p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <h2>{{ home.news_title }}</h2>
    </div>
    <div class="grid grid-3">{{ @news_latest }}</div>
    <div class="actions"><a class="btn ghost arrow" href="{{ @prefix }}actualites.html">{{ home.news_all }}</a></div>
  </div>
</section>
